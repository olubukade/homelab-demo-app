apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelab-demo
  template:
    metadata:
      labels:
        app: homelab-demo
    spec:
      containers:
      - name: homelab-demo
        image: homelab-demo:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-demo-service
spec:
  selector:
    app: homelab-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: NodePort
